name: FieldShift checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Ensure no obvious credential files are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'
          ! git grep -nE 'ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' -- . ':!SECURITY.md'
